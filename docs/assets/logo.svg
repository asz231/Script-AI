<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="scriptai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="55%" stop-color="#D9383A"/>
      <stop offset="100%" stop-color="#B32426"/>
    </linearGradient>
    <linearGradient id="scriptai-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="scriptai-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#D9383A" flood-opacity="0.28"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#scriptai-grad)" filter="url(#scriptai-shadow)"/>
  
  <!-- Script Sheet Contour (Light White Overlay) -->
  <path d="M12 12C12 10.8954 12.8954 10 14 10H27L33 16V34C33 35.1046 32.1046 36 31 36H14C12.8954 36 12 35.1046 12 34V12Z" fill="white" fill-opacity="0.14"/>
  
  <!-- Screenplay Script Lines -->
  <line x1="16" y1="15" x2="25" y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="16" y1="20" x2="21" y2="20" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55"/>
  
  <!-- Dynamic Play Button / Video Beacon (Front & Center) -->
  <path d="M18 24.5C18 23.4 19.2 22.7 20.2 23.25L28.1 27.75C29.05 28.3 29.05 29.7 28.1 30.25L20.2 34.75C19.2 35.3 18 34.6 18 33.5V24.5Z" fill="#FFFFFF"/>
  
  <!-- 4-point AI Star on Top-Right -->
  <path d="M35 5C35 8.3 37.7 11 41 11C37.7 11 35 13.7 35 17C35 13.7 32.3 11 29 11C32.3 11 35 8.3 35 5Z" fill="url(#scriptai-spark)"/>
